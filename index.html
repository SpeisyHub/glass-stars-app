<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlassStars Premium NFT Market</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #080c14;
            --surface-color: rgba(15, 23, 42, 0.6);
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #00f2fe 100%);
            --gift-gradient: linear-gradient(135deg, #7928ca 0%, #ff0080 100%);
            --text-main: #ffffff;
            --text-muted: #64748b;
            --border-glow: rgba(0, 242, 254, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Фоновое неоновое свечение */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: 20%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        /* Карта Баланса */
        .balance-card {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            margin-bottom: 24px;
            box-sizing: border-box;
        }

        .balance-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 800;
        }

        .balance-currency {
            color: var(--accent-cyan);
            font-size: 24px;
            margin-left: 6px;
        }

        .section-title {
            align-self: flex-start;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            color: var(--text-muted);
            width: 100%;
            max-width: 420px;
        }

        /* СЕТКА С ТОВАРНЫМИ КАРТОЧКАМИ (GRID) */
        .grid-container {
            width: 100%;
            max-width: 420px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .nft-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .nft-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .nft-card:active {
            transform: scale(0.97) translateY(-2px);
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 20px var(--border-glow);
        }

        .nft-card:active::before {
            opacity: 1;
        }

        /* Крутая 3D-сфера вместо уродливых картинок */
        .nft-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--gift-gradient);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(255, 0, 128, 0.3);
            position: relative;
        }

        .nft-avatar.rose { background: linear-gradient(135deg, #ff0055 0%, #790022 100%); box-shadow: 0 8px 20px rgba(255,0,85,0.3); }
        .nft-avatar.frog { background: linear-gradient(135deg, #00ff87 0%, #60efff 100%); box-shadow: 0 8px 20px rgba(0,255,135,0.3); }
        .nft-avatar.star { background: linear-gradient(135deg, #ffb300 0%, #f77737 100%); box-shadow: 0 8px 20px rgba(255,179,0,0.3); }

        .nft-badge {
            position: absolute;
            bottom: -5px;
            background: #000;
            color: var(--accent-cyan);
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 8px;
            border: 1px solid var(--accent-cyan);
        }

        .nft-card h3 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 700;
        }

        .nft-card .serial {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-family: monospace;
        }

        .btn-price {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-cyan);
            padding: 8px 0;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nft-card:active .btn-price {
            background: var(--accent-gradient);
            color: #050811;
            border-color: transparent;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="user-title">GLASSSTARS MARKET</h1>
    </div>

    <div class="balance-card">
        <div class="balance-title">Тестовый баланс аккаунта</div>
        <div class="balance-amount">100.00<span class="balance-currency">USDT</span></div>
    </div>

    <div class="section-title">Лимитированные Telegram NFT Подарки</div>

    <div class="grid-container">
        <!-- Подарок 1 -->
        <div class="nft-card" onclick="buyItem('TG Gift: Лягушка Пепе', 25.00)">
            <div class="nft-avatar frog">🐸<span class="nft-badge">NFT</span></div>
            <h3>Лягушка Пепе</h3>
            <div class="serial">#432 из 5000</div>
            <button class="btn-price">25$</button>
        </div>

        <!-- Подарок 2 -->
        <div class="nft-card" onclick="buyItem('TG Gift: Магическая Роза', 12.50)">
            <div class="nft-avatar rose">🌹<span class="nft-badge">NFT</span></div>
            <h3>Магическая Роза</h3>
            <div class="serial">#88 из 10000</div>
            <button class="btn-price">12.5$</button>
        </div>

        <!-- Подарок 3 -->
        <div class="nft-card" onclick="buyItem('TG Gift: Утка Дуров', 50.00)">
            <div class="nft-avatar">🦆<span class="nft-badge">RARE</span></div>
            <h3>Утка Дуров</h3>
            <div class="serial">#13 из 1000</div>
            <button class="btn-price">50$</button>
        </div>

        <!-- Подарок 4 -->
        <div class="nft-card" onclick="buyItem('TG Gift: Золотая Звезда', 150.00)">
            <div class="nft-avatar star">⭐<span class="nft-badge">MYTHIC</span></div>
            <h3>Золотая Звезда</h3>
            <div class="serial">#7 из 100</div>
            <button class="btn-price">150$</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        tg.setHeaderColor('#080c14');
        tg.setBackgroundColor('#080c14');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-title').innerText = `GLASSSTARS • ${tg.initDataUnsafe.user.first_name.toUpperCase()}`;
        }

        function buyItem(itemName, price) {
            const data = {
                action: "buy_request",
                item: itemName,
                cost: price
            };
            tg.sendData(JSON.stringify(data)); 
            tg.close(); 
        }
    </script>
</body>
</html>
