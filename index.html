<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Getgems Custom Marketplace</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0c101b;
            --surface-card: #161c2c;
            --accent-cyan: #00f2fe;
            --accent-blue: #2481cc;
            --text-main: #ffffff;
            --text-muted: #74859e;
            --ton-blue: #0098ea;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 12px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .getgems-header {
            width: 100%; max-width: 460px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; padding: 0 4px;
        }

        .getgems-header h1 {
            margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
        }

        .getgems-header h1 span { color: var(--ton-blue); }

        .balance-badge {
            background: rgba(0, 152, 234, 0.1);
            border: 1px solid rgba(0, 152, 234, 0.25);
            color: var(--ton-blue);
            padding: 6px 12px; border-radius: 20px;
            font-size: 13px; font-weight: 700;
        }

        .getgems-tabs {
            display: flex; width: 100%; max-width: 460px; gap: 8px; margin-bottom: 16px;
        }

        .tab-item {
            flex: 1; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted); padding: 10px 0; font-size: 13px; font-weight: 600;
            cursor: pointer; border-radius: 12px; transition: all 0.2s;
        }

        .tab-item.active {
            background: var(--ton-blue); color: #ffffff; border-color: transparent;
            box-shadow: 0 4px 12px rgba(0, 152, 234, 0.3);
        }

        .getgems-grid {
            width: 100%; max-width: 460px;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px;
        }

        .nft-card {
            background: var(--surface-card); border-radius: 18px; overflow: hidden;
            display: flex; flex-direction: column; box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; transition: transform 0.2s;
        }

        .nft-card:active { transform: scale(0.96); border-color: var(--ton-blue); box-shadow: 0 0 10px rgba(0, 152, 234, 0.2); }

        .nft-preview {
            width: 100%; aspect-ratio: 1 / 1; background: #080b13;
            overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }

        .nft-preview svg {
            width: 60%; height: 60%;
        }

        .nft-collection-badge {
            position: absolute; bottom: 8px; left: 8px;
            background: rgba(12, 16, 27, 0.85); backdrop-filter: blur(4px);
            padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; color: #ffffff;
        }

        .nft-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }

        .nft-title {
            font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .nft-meta { display: flex; flex-direction: column; gap: 2px; }

        .nft-price-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

        .nft-price-value { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 4px; }

        .ton-icon { color: var(--ton-blue); font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="getgems-header">
        <h1>Getgems<span>.io</span></h1>
        <div class="balance-badge">100.00 USDT</div>
    </div>

    <div class="getgems-tabs">
        <button class="tab-item active" onclick="switchTab('gifts', this)">NFT Gifts</button>
        <button class="tab-item" onclick="switchTab('usernames', this)">Usernames</button>
        <button class="tab-item" onclick="switchTab('numbers', this)">Numbers</button>
    </div>

    <div class="getgems-grid" id="market-display"></div>

    <script>
        // БАЗА ДАННЫХ С НЕОНОВЫМИ КИБЕР-ВЕКТОРАМИ ДЛЯ СТОПРОЦЕНТНОЙ ЗАГРУЗКИ
        const products = {
            gifts: [
                { name: "Magic Pumpkin", id: "#322/5000", price: 35.0, collection: "Telegram Gifts", color: "#ffaa00", icon: "🎃" },
                { name: "Golden Duck", id: "#13/1000", price: 120.0, collection: "Telegram Gifts", color: "#ffea00", icon: "🦆" },
                { name: "Premium Rose", id: "#88/10000", price: 15.0, collection: "Telegram Gifts", color: "#ff0055", icon: "🌹" },
                { name: "Cyber Shield", id: "#441/2500", price: 55.0, collection: "Telegram Gifts", color: "#00f2fe", icon: "🛡️" }
            ],
            usernames: [
                { name: "@cyber", id: "Username", price: 950.0, collection: "Telegram Usernames", color: "#2481cc", icon: "@" },
                { name: "@nft", id: "Username", price: 4200.0, collection: "Telegram Usernames", color: "#00e676", icon: "💎" }
            ],
            numbers: [
                { name: "+888 0707 7777", id: "Number", price: 340.0, collection: "Anonymous Numbers", color: "#7928ca", icon: "📱" },
                { name: "+888 1111 2222", id: "Number", price: 890.0, collection: "Anonymous Numbers", color: "#ff0080", icon: "📟" }
            ]
        };

        const tg = window.Telegram.WebApp;
        if (tg && tg.expand) {
            tg.expand();
            tg.setHeaderColor('#0c101b');
            tg.setBackgroundColor('#0c101b');
        }

        function renderMarket(category) {
            const container = document.getElementById("market-display");
            container.innerHTML = "";
            
            products[category].forEach(item => {
                const card = document.createElement("div");
                card.className = "nft-card";
                card.onclick = () => buyItem(item.name, item.price);
                
                // Генерируем высококачественный неоновый круг с подсветкой и иконкой внутри
                card.innerHTML = `
                    <div class="nft-preview">
                        <div style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, ${item.color}22, ${item.color}44); border: 2px solid ${item.color}; display: flex; align-items: center; justify-content: center; font-size: 36px; box-shadow: 0 0 15px ${item.color}44;">
                            ${item.icon}
                        </div>
                        <span class="nft-collection-badge">${item.collection}</span>
                    </div>
                    <div class="nft-info">
                        <div class="nft-title">${item.name}</div>
                        <div class="nft-meta">
                            <span class="nft-price-title">Цена</span>
                            <span class="nft-price-value">${item.price.toFixed(0)} <span class="ton-icon">USDT</span></span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(category, button) {
            document.querySelectorAll(".tab-item").forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");
            renderMarket(category);
        }

        function buyItem(itemName, price) {
            const data = { action: "buy_request", item: itemName, cost: price };
            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify(data));
                tg.close();
            } else {
                alert(`Getgems: Запрос на покупку ${itemName} за ${price} USDT`);
            }
        }

        renderMarket("gifts");
    </script>
</body>
</html>
